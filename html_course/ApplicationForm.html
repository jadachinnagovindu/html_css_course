<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="chinnagovindu">
    <meta name="description" content="Application Form">
    <meta name="keywords" content="Application Form,user Information">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>

<body>
    <center>
        <h1>Application Form</h1>

        <ceneter></ceneter>


        <form name="Application Form" method="get" action="./Portfolio.html">
            <center>
                <div>
                    First Name : <input type="text" name="first name" id="first name" placeholder="First Name">
                </div>
                <div>
                    Last Name : <input type="text" name="last name" id="last name" placeholder="Last Name">
                </div>
                <div>
                    Date Of Birth : <input type="Date" name="date of birth" id="dob" placeholder="Date Of Birth">
                </div>
                <div>
                    Age : <input type="age" name="age" name="age" id="age" placeholder="Age">
                </div>
                <div>
                    Gender: <input type="radio" name="Gender" id="male" value="male">Male
                </div>
                <div>
                    <input type="radio" name="Gender" id="female" value="female">Female
                </div>
                <div>
                    Email : <input type="email" name="email" id="email" placeholder="Email">
                </div>
                <div>

                    Position Availble : <input type="radio" name="Developer" id="junior Developer"
                        value="junior Developer">Junior
                    Developer
                    <input type="radio" name="Developer" id="mid-level Developer"
                        value="Mid-level Developer">Mid-level Developer
                    <input type="radio" name="Developer" id="senior Developer" value="Senior Developer">Senior
                    Developer <br>
                    Programming Languages Known : 
                    <input type="checkbox" name="HTML" id="HTML" value="HTML">HTML
                    <input type="checkbox" name="CSS" id="CSS" value="CSS">CSS
                    <input type="checkbox" name="JavaScript" id="JavaScript" value="JavaScript">JavaScript
                    <input type="checkbox" name="Java" id="Java" value="Java">Java   
                    <br>
                   Password: <input type="password" name="password" id="password" placeholder="Password">
                   Confirm Password: <input type="password" name="confirm password" id="confirm password" placeholder="Confirm Password">
                    <br>                  
                     <input type="reset" name="reset" id="reset" value="Reset">
                    <input type="submit" name="submit" id="submit" value="Submit">
            </center>



        </form>
</body>

</html>
